# ===============================================================
#  항만·해안 AI 해설 영상 자동 제작 설정 파일
#  API 키는 여기 적지 말고 .env 파일에 넣으세요.
# ===============================================================

format: "longform"                   # "longform" (가로 16:9 다큐) | "shorts" (세로 9:16 쇼츠)

formats:
  longform:
    target_minutes: 6                  # 5~8분 롱폼 다큐멘터리 (매일 자동 업로드 기준)
    scenes: 42                         # 42개 씬 (장면당 약 8~9초)
    width: 1920
    height: 1080
    aspect_ratio: "16:9"
    dalle_size: "1792x1024"
    subtitle_font_size: 54
    subtitle_margin_v: 110
    thumbnail_size: [1280, 720]
    thumbnail_font_size: 105
  shorts:
    target_minutes: 0.85               # 약 50초 내외 (60초 이내 쇼츠 최적화)
    scenes: 8                          # 8개 씬 (장면당 약 6~7초 빠른 템포)
    width: 1080
    height: 1920
    aspect_ratio: "9:16"
    dalle_size: "1024x1792"
    subtitle_font_size: 72             # 모바일 스마트폰 전면 자막 (크고 굵게)
    subtitle_margin_v: 280             # 하단 쇼츠 UI(제목, 사운드 버튼 등) 가리지 않게 위로 띄움
    thumbnail_size: [1080, 1920]
    thumbnail_font_size: 90

channel:
  name: "OCEAN CODE LAB (OCL)"       # 공식 채널명: OCEAN CODE LAB (OCL)
  language: "ko"

script:
  model: "claude-sonnet-4-6"
  # 대본의 관점·톤: OCEAN CODE LAB (OCL) 오리지널 고밀도 해양 공학 다큐멘터리
  persona: >
    대한민국 해안·항만 토목공학의 본질을 밝히는 전문 다큐멘터리 채널 'OCEAN CODE LAB (OCL)' 메인 내레이터 겸 수석 공학 분석관.
    유행어나 가벼운 클리셰를 철저히 배제하고, 압도적인 해양 물리 스케일(수만 톤 자중, 수심 30m, 10m 괴물 파고)과
    실제 해양수산부 항만및어항설계기준(KDS 64 10), 한국 주요 무역항(부산신항, 포항영일만, 울산신항, 삼척, 울릉도 사동항 등)에 축조된
    실제 케이슨 혼성제(유공 슬릿, 벌집형 복합 셀, 인터로킹 전단키, 사석 마운드 및 테트라포드 연동)의 도면과 수리역학 팩트를 기반으로
    지적이고 묵직하며 몰입감 넘치는 명품 다큐멘터리를 전개한다.

images:
  provider: "gemini"                 # gemini (결제 등록된 키 필요) | openai (gpt-image)
  gemini_models: ["gemini-3.1-flash-image-preview", "gemini-2.5-flash-image"]
  openai_models: ["gpt-image-1.5", "gpt-image-1", "gpt-image-1-mini"]
  openai_quality: "medium"
  style_reference: true              # 첫 장면을 기준으로 이후 장면 그림체 통일 (Gemini)
  # '신비한 건축사전' 계열: 깔끔한 3D 일러스트 단면도(컷어웨이) + 밝은 교육용 다큐 톤
  style_suffix: >
    Stylized 3D illustrated cutaway cross-section in the style of a high-end educational
    engineering documentary: the structure is sliced open so the inside and the seabed layers
    below the waterline are visible, clean matte materials, soft global illumination,
    bright clear turquoise water, readable forms and strong silhouette, consistent camera
    height, cinematic 16:9 composition with empty space for captions, highly detailed but uncluttered,
    absolutely no text, no letters, no labels, no numbers, no watermark, no logos

tts:
  provider: "typecast"               # typecast(유료 모건 보이스) | edge(무료) | elevenlabs(유료)
  typecast_voice_id: "tc_6256118ea1103af69f0a87ec"   # 모건 (다큐멘터리/광고/해설 최고급 남성 톤)
  typecast_model: "ssfm-v30"
  typecast_tempo: 1.05               # 1.0~1.1 (다큐에 적합한 몰입감 있는 템포)
  edge_voice: "ko-KR-InJoonNeural"   # 비상용 백업
  rate: "+6%"
  elevenlabs_voice_id: ""
  elevenlabs_model: "eleven_multilingual_v2"

video_gen:                           # 구글 플로우 / Veo / Gemini Omni Flash 비디오 생성 연동
  enabled: false                     # 최소 비용 모드: 영상 클립 생성 끔 (패럴랙스 카메라 무빙 사용)
  model: "gemini-omni-1.1-flash"     # gemini-omni-1.1-flash | veo-3.1-generate-preview
  max_scenes: 8
  seconds: 4                         # 플로우 4초 클립 규격
  resolution: "1080p"
  slow_factor: 1.0
  style_suffix: "smooth cinematic 3D camera pan, bright daylight, sparkling clear water, dynamic engineering simulation"

video:
  fps: 24
  parallax_strength: 0.08            # 2.5D 패럴랙스 세기 (0.03 은은함 ~ 0.08 역동적 카메라 무빙)
  dust_opacity: 0.55                 # 부유물 파티클 밝기 0~1 (0이면 끔)
  subtitle_font: "assets/fonts/NotoSansCJK-Bold.ttc"
  subtitle_size: 64
  bgm_volume: 0.08                   # 0~1
  bgm_dir: "assets/bgm"

thumbnail:
  font: "assets/fonts/NotoSansCJK-Black.ttc"
  font_size: 105

youtube:
  privacy: "public"                  # public | unlisted | private
  category_id: "27"                  # 27 = Education
  default_tags: ["항만", "해안", "토목", "방파제", "해안침식", "바다"]
  client_secret: "client_secret.json"
  token_file: "token.json"
