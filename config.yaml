# ===============================================================
#  항만·해안 AI 해설 영상 자동 제작 설정 파일
#  API 키는 여기 적지 말고 .env 파일에 넣으세요.
# ===============================================================

channel:
  name: "OCEAN CODE LAB (OCL)"       # 공식 채널명: OCEAN CODE LAB (OCL)
  language: "ko"
  target_minutes: 2.0                # 신비한 건축사전식 압축적이고 몰입감 높은 2분 고밀도 다큐멘터리
  scenes: 16                         # 16개 씬 (장면당 약 6~8초)의 빠른 컷 전환으로 지루할 틈 없는 신비한 건축사전 템포 구현

script:
  model: "claude-sonnet-4-6"
  # 대본의 관점·톤: OCEAN CODE LAB (OCL) 오리지널 고밀도 해양 공학 다큐멘터리
  persona: >
    대한민국 해안·항만 토목공학의 본질을 밝히는 전문 다큐멘터리 채널 'OCEAN CODE LAB (OCL)' 메인 내레이터 겸 수석 공학 분석관.
    유행어나 가벼운 클리셰를 철저히 배제하고, 압도적인 해양 물리 스케일(수만 톤 자중, 수심 30m, 10m 괴물 파고)과
    실제 해양수산부 항만및어항설계기준(KDS 64 10), 한국 주요 무역항(부산신항, 포항영일만, 울산신항, 삼척, 울릉도 사동항 등)에 축조된
    실제 케이슨 혼성제(유공 슬릿, 벌집형 복합 셀, 인터로킹 전단키, 사석 마운드 및 테트라포드 연동)의 도면과 수리역학 팩트를 기반으로
    지적이고 묵직하며 몰입감 넘치는 명품 다큐멘터리를 전개한다.

images:
  provider: "openai"                 # gemini (Google Imagen 3/4) | openai (DALL-E 3)
  gemini_model: "imagen-3.0-generate-002"
  openai_model: "dall-e-3"
  width: 1920
  height: 1080
  # Unreal Engine 5 기반 실사풍 3D 건축/해저 단면 투시도(Cross-section cutaway) & 파압 벡터 HUD 오버레이
  style_suffix: >
    An isometric 3D architectural engineering cross-section cutaway diagram of a massive modern Korean reinforced concrete caisson composite breakwater in the deep ocean,
    photorealistic cross-section showing detailed soil and seabed rock layers, heavy rubble mound bedding, submerged riprap gravel,
    perforated slit wave chambers with active water intake, glowing red hydrodynamic pressure vectors and HUD engineering callout lines,
    dramatic cinematic volumetric lighting, Unreal Engine 5 render, Octane photorealistic, highly detailed physical concrete texture, 8k, professional documentary engineering visual, 16:9

tts:
  provider: "edge"                   # edge(무료) | elevenlabs(유료, 고품질)
  edge_voice: "ko-KR-InJoonNeural"   # 신뢰감 있고 귀에 쏙쏙 박히는 남성 다큐멘터리 해설 톤 (InJoon)
  rate: "+6%"                        # 유튜브 다큐에 최적화된 빠르고 몰입감 넘치는 템포 (+6%)
  elevenlabs_voice_id: ""
  elevenlabs_model: "eleven_multilingual_v2"

video_gen:                           # AI 동영상 생성 (Veo) - 고비용 발생 방지를 위해 완전 비활성화 (편당 500원 이하 유지)
  enabled: false
  model: "veo-3.1-generate-preview"
  max_scenes: 0
  seconds: 0
  resolution: "1080p"
  slow_factor: 1.0
  style_suffix: ""

video:
  fps: 24
  parallax_strength: 0.08            # 2.5D 패럴랙스 세기 (0.03 은은함 ~ 0.08 역동적 카메라 무빙)
  dust_opacity: 0.55                 # 부유물 파티클 밝기 0~1 (0이면 끔)
  subtitle_font: "assets/fonts/NotoSansCJK-Bold.ttc"
  subtitle_size: 64
  bgm_volume: 0.08                   # 0~1
  bgm_dir: "assets/bgm"

thumbnail:
  font: "assets/fonts/NotoSansCJK-Black.ttc"
  font_size: 170

youtube:
  privacy: "public"                  # public | unlisted | private
  category_id: "27"                  # 27 = Education
  default_tags: ["항만", "해안", "토목", "방파제", "해안침식", "바다"]
  client_secret: "client_secret.json"
  token_file: "token.json"
