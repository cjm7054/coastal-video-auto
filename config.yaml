# ===============================================================
#  항만·해안 AI 해설 영상 자동 제작 설정 파일
#  API 키는 여기 적지 말고 .env 파일에 넣으세요.
# ===============================================================

channel:
  name: "OCEAN CODE LAB (OCL)"       # 공식 채널명: OCEAN CODE LAB (OCL)
  language: "ko"
  target_minutes: 2.5                # 신비한 건축사전식 압축적이고 몰입감 높은 2~3분 고밀도 다큐멘터리
  scenes: 10                         # 10개 씬 (장면당 약 15초)으로 늘어짐 없는 빠른 전개

script:
  model: "claude-sonnet-4-6"
  # 대본의 관점·톤. 전문가 채널이지만 시청자는 일반인이라는 점을 명시
  persona: >
    유튜브 '신비한 건축사전' 총괄 디렉터 스타일의 해안·항만 토목공학 전문 해설가.
    바다와 파도라는 극한의 자연을 상대로 인간이 일구어낸 경이로운 공학적 비밀을
    "여기 OO가 있습니다", "아주 환장할 노릇이죠", "비상한 발상이 등장합니다" 등의
    흡입력 넘치는 딕션과 3D 디오라마 단면 투시도 묘사로 흥미진진하게 풀어낸다.

images:
  provider: "gemini"                 # gemini (Google Imagen 3/4) | openai (DALL-E 3)
  gemini_model: "imagen-3.0-generate-002"
  openai_model: "dall-e-3"
  width: 1920
  height: 1080
  # 모든 이미지에 공통 적용되는 스타일 (신비한 건축사전식 3D 디오라마 단면 투시도 엔지니어링 렌더링)
  style_suffix: >
    photorealistic 3D architectural cross-section cutaway rendering, detailed civil engineering diorama,
    Octane Render, Cinema 4D, V-Ray, hyper-detailed 8k, dramatic dark gradient studio background,
    subtle red architectural measurement lines and callout arrows, transparent water cutaway showing submerged foundation,
    crisp textures, sharp focus, technical architectural visualization, no cartoon, 16:9

tts:
  provider: "edge"                   # edge(무료) | elevenlabs(유료, 고품질)
  edge_voice: "ko-KR-SunHiNeural"   # 차분하고 지적인 여성 아나운서 톤 (SunHi)
  rate: "-2%"                        # 살짝 차분하고 안정감 있는 낭독 속도 (-2%)
  elevenlabs_voice_id: ""
  elevenlabs_model: "eleven_multilingual_v2"

video_gen:                           # 핵심 장면 AI 동영상 (Google Veo 3.1)
  enabled: true
  model: "veo-3.1-generate-preview"
  max_scenes: 4                      # 핵심 4대 승부처(도입 파도, 난관 충격, 공학 메커니즘, 클라이맥스)에 Veo 3.1 집중 투입 (비용 1/4 절감)
  seconds: 8
  resolution: "1080p"
  slow_factor: 0.8                   # 클립 재생 속도(0.8 = 20% 느리게 → 10초)
  style_suffix: >
    smooth cinematic orbital camera pan around photorealistic 3D architectural cutaway structure,
    realistic fluid dynamic water simulation, slow-motion wave action, 4k civil engineering diorama,
    raytraced reflections, high-end technical animation, no cartoon, no watermark, no text

video:
  fps: 24
  parallax_strength: 0.08            # 2.5D 패럴랙스 세기 (0.03 은은함 ~ 0.08 역동적 카메라 무빙)
  dust_opacity: 0.55                 # 부유물 파티클 밝기 0~1 (0이면 끔)
  subtitle_font: "assets/fonts/NotoSansCJK-Bold.ttc"
  subtitle_size: 64
  bgm_volume: 0.08                   # 0~1
  bgm_dir: "assets/bgm"

thumbnail:
  font: "assets/fonts/NotoSansCJK-Black.ttc"
  font_size: 170

youtube:
  privacy: "public"                  # public | unlisted | private
  category_id: "27"                  # 27 = Education
  default_tags: ["항만", "해안", "토목", "방파제", "해안침식", "바다"]
  client_secret: "client_secret.json"
  token_file: "token.json"
