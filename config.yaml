# ===============================================================
#  항만·해안 AI 해설 영상 자동 제작 설정 파일
#  API 키는 여기 적지 말고 .env 파일에 넣으세요.
# ===============================================================

channel:
  name: "바다와 항만 이야기"          # 채널명 (대본 인트로/아웃트로에 사용)
  language: "ko"
  target_minutes: 3                  # 테스트용 길이 (3분으로 단축하여 빠른 검증)
  scenes: 6                          # 테스트용 장면 수 (6개 장면)

script:
  model: "claude-sonnet-4-6"
  # 대본의 관점·톤. 전문가 채널이지만 시청자는 일반인이라는 점을 명시
  persona: >
    유튜브 '신비한 건축사전' 스타일의 해안·항만 토목공학 전문 해설가.
    바다와 파도라는 극한의 자연을 상대로 인간이 일구어낸 경이로운 공학적 비밀을
    빠르고 명확한 딕션, 날카로운 질문(훅), 명쾌한 시각적 비유와 수치로 흥미진진하게 풀어낸다.

images:
  provider: "openai"                 # openai(DALL-E 3 실사 렌더링) | gemini | pollinations
  gemini_model: "imagen-3.0-generate-002"
  openai_model: "dall-e-3"
  width: 1920
  height: 1080
  # 모든 이미지에 공통 적용되는 스타일 (실사 항만·해안 토목 엔지니어링 다큐멘터리 스타일)
  style_suffix: >
    National Geographic documentary photograph, award winning civil engineering photography,
    Sony A7R IV 35mm lens, raw realistic industrial lighting, authentic maritime civil engineering,
    hyper-realistic 8k, sharp detailed textures, no fantasy, no futuristic elements, no cartoon,
    no distorted ships, no strange structures, no text, 16:9

tts:
  provider: "edge"                   # edge(무료) | elevenlabs(유료, 고품질)
  edge_voice: "ko-KR-SunHiNeural"   # 차분하고 지적인 여성 아나운서 톤 (SunHi)
  rate: "-2%"                        # 살짝 차분하고 안정감 있는 낭독 속도 (-2%)
  elevenlabs_voice_id: ""
  elevenlabs_model: "eleven_multilingual_v2"

video_gen:                           # 핵심 장면 AI 동영상 (무료 테스트 시 비활성화)
  enabled: false
  model: "veo-3.1-lite-generate-preview"
  max_scenes: 0                      # 패럴랙스 2.5D 카메라 무빙으로 대체 (100% 무료)
  seconds: 8
  resolution: "1080p"
  slow_factor: 0.8                   # 클립 재생 속도(0.8 = 20% 느리게 → 10초)
  style_suffix: >
    slow cinematic camera movement, realistic physics, water and particles moving naturally,
    no text, no people, engineering visualization

video:
  fps: 24
  parallax_strength: 0.08            # 2.5D 패럴랙스 세기 (0.03 은은함 ~ 0.08 역동적 카메라 무빙)
  dust_opacity: 0.55                 # 부유물 파티클 밝기 0~1 (0이면 끔)
  subtitle_font: "assets/fonts/NotoSansCJK-Bold.ttc"
  subtitle_size: 64
  bgm_volume: 0.08                   # 0~1
  bgm_dir: "assets/bgm"

thumbnail:
  font: "assets/fonts/NotoSansCJK-Black.ttc"
  font_size: 170

youtube:
  privacy: "public"                  # public | unlisted | private
  category_id: "27"                  # 27 = Education
  default_tags: ["항만", "해안", "토목", "방파제", "해안침식", "바다"]
  client_secret: "client_secret.json"
  token_file: "token.json"
