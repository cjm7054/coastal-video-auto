# ===============================================================
#  항만·해안 AI 해설 영상 자동 제작 설정 파일
#  API 키는 여기 적지 말고 .env 파일에 넣으세요.
# ===============================================================

channel:
  name: "OCEAN CODE LAB (OCL)"       # 공식 채널명: OCEAN CODE LAB (OCL)
  language: "ko"
  target_minutes: 2.5                # 신비한 건축사전식 압축적이고 몰입감 높은 2~3분 고밀도 다큐멘터리
  scenes: 10                         # 10개 씬 (장면당 약 15초)으로 늘어짐 없는 빠른 전개

script:
  model: "claude-sonnet-4-6"
  # 대본의 관점·톤: 실제 최신 항만및어항설계기준(KDS), 유체역학/해안공학 논문, 현장 실증 공법 기반의 고증된 공학 해설
  persona: >
    항만·해안 토목공학 박사급 전문 지식을 갖춘 유튜브 '신비한 건축사전' 총괄 디렉터 스타일의 메인 해설가.
    근거 없는 AI 상상(할루시네이션)을 철저히 배제하고, 실제 해양수산부 항만설계기준(KDS 64),
    국내외 공인 학술지 논문(ASCE, KSCE 등), 전산유체역학(CFD/Flow-3D) 수치해석, 수리모형실험 검증 데이터,
    실제 시공 현장(부산신항, 포항영일만, 일본 가마이시 등)의 실증 공법(소파블록, 케이슨, 공극률, 한계소파 파고 등)을
    정확한 수치와 과학적 메커니즘으로 시청자에게 귀에 쏙쏙 박히게 해설한다.

images:
  provider: "gemini"                 # gemini (Google Imagen 3/4) | openai (DALL-E 3)
  gemini_model: "imagen-3.0-generate-002"
  openai_model: "dall-e-3"
  width: 1920
  height: 1080
  # 모든 이미지에 공통 적용되는 스타일 (자연스럽게 이어지는 해안선 및 바다 3D 토목공학 조감도 엔지니어링 렌더링)
  style_suffix: >
    photorealistic 3D cinematic aerial ocean perspective of maritime civil engineering, natural curved coastline,
    seamlessly integrated shoreline terrain, realistic ocean wave physics, Octane Render, Cinema 4D, V-Ray,
    hyper-detailed 8k, subtle red architectural measurement lines and callout arrows, transparent water showing submerged foundation,
    crisp textures, sharp focus, technical architectural visualization, no cartoon, 16:9

tts:
  provider: "edge"                   # edge(무료) | elevenlabs(유료, 고품질)
  edge_voice: "ko-KR-InJoonNeural"   # 신뢰감 있고 귀에 쏙쏙 박히는 남성 다큐멘터리 해설 톤 (InJoon)
  rate: "+6%"                        # 유튜브 다큐에 최적화된 빠르고 몰입감 넘치는 템포 (+6%)
  elevenlabs_voice_id: ""
  elevenlabs_model: "eleven_multilingual_v2"

video_gen:                           # 핵심 장면 AI 동영상 (Google Veo 3.1)
  enabled: true
  model: "veo-3.1-generate-preview"
  max_scenes: 4                      # 핵심 4대 승부처(도입 파도, 난관 충격, 공학 메커니즘, 클라이맥스)에 Veo 3.1 집중 투입 (비용 1/4 절감)
  seconds: 8
  resolution: "1080p"
  slow_factor: 0.8                   # 클립 재생 속도(0.8 = 20% 느리게 → 10초)
  style_suffix: >
    smooth cinematic orbital camera pan around photorealistic 3D maritime engineering structure,
    integrated natural shoreline landscape, realistic fluid dynamic ocean water simulation, slow-motion wave action,
    hyper-detailed 4k civil engineering visualization, raytraced water reflections, high-end technical animation, no cartoon, no watermark, no text

video:
  fps: 24
  parallax_strength: 0.08            # 2.5D 패럴랙스 세기 (0.03 은은함 ~ 0.08 역동적 카메라 무빙)
  dust_opacity: 0.55                 # 부유물 파티클 밝기 0~1 (0이면 끔)
  subtitle_font: "assets/fonts/NotoSansCJK-Bold.ttc"
  subtitle_size: 64
  bgm_volume: 0.08                   # 0~1
  bgm_dir: "assets/bgm"

thumbnail:
  font: "assets/fonts/NotoSansCJK-Black.ttc"
  font_size: 170

youtube:
  privacy: "public"                  # public | unlisted | private
  category_id: "27"                  # 27 = Education
  default_tags: ["항만", "해안", "토목", "방파제", "해안침식", "바다"]
  client_secret: "client_secret.json"
  token_file: "token.json"
