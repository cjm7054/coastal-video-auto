# ===============================================================
#  항만·해안 AI 해설 영상 자동 제작 설정 파일
#  API 키는 여기 적지 말고 .env 파일에 넣으세요.
# ===============================================================

channel:
  name: "OCEAN CODE LAB (OCL)"       # 공식 채널명: OCEAN CODE LAB (OCL)
  language: "ko"
  target_minutes: 2.5                # 신비한 건축사전식 압축적이고 몰입감 높은 2~3분 고밀도 다큐멘터리
  scenes: 10                         # 10개 씬 (장면당 약 15초)으로 늘어짐 없는 빠른 전개

script:
  model: "claude-sonnet-4-6"
  # 대본의 관점·톤: 실제 한국 해역(동해, 남해, 서해)에 축조된 최신 케이슨 혼성제 및 소파블록 방파제 공학 해설
  persona: >
    한국 해안·항만 토목공학 최고 권위의 전문 지식을 갖춘 유튜브 '신비한 건축사전' 총괄 디렉터 스타일의 메인 해설가.
    근거 없는 AI 상상(할루시네이션)을 철저히 배제하고, 실제 해양수산부 항만및어항설계기준(KDS 64 10),
    한국 주요 무역항(부산신항, 포항영일만항, 울산신항, 삼척, 울릉사동항 등)에 실제로 시공된
    '케이슨식 혼성제(Composite Breakwater with Caisson)'를 중심으로 해설한다.
    단순 직립벽 케이슨뿐만 아니라 최신 한국 실증 특허 및 신기술 공법인
    '유공 슬릿(Slit) 케이슨(전면 유공벽 파력 감쇄)', '벌집형(Honeycomb) 복합 케이슨', '곡면 반사파 흡수 케이슨',
    '인터로킹 키(Key) 접합식 케이슨', '기초 사석 마운드 및 근고블록 세굴 방지공', '소파블록(테트라포드, 아크로포드, 시락 등) 피복 혼성제' 등
    실제 현장 도면과 수리모형실험 검증 공법의 구조적 디테일을 정확하고 흥미진진하게 풀어낸다.

images:
  provider: "gemini"                 # gemini (Google Imagen 3/4) | openai (DALL-E 3)
  gemini_model: "imagen-3.0-generate-002"
  openai_model: "dall-e-3"
  width: 1920
  height: 1080
  # 모든 이미지에 공통 적용되는 스타일 (신비한 건축사전 특유의 세련되고 명쾌한 3D 엔지니어링 일러스트 & 조감도)
  style_suffix: >
    clean and stylish 3D isometric architectural engineering illustration style, 'Mysterious Architecture Dictionary' YouTube visual style,
    modern Korean reinforced concrete caisson composite breakwater, detailed perforated slit wave chambers, honeycomb cell internal structure,
    rubble mound foundation, bold engineering line-art accents, subtle red measurement dimension callouts and arrows,
    vibrant clear water with visible underwater foundation and scour blocks, Cinema 4D, Octane Render isometric view,
    hyper-clean textures, sharp focus, professional technical explainer illustration, no photorealistic muddy noise, 16:9

tts:
  provider: "edge"                   # edge(무료) | elevenlabs(유료, 고품질)
  edge_voice: "ko-KR-InJoonNeural"   # 신뢰감 있고 귀에 쏙쏙 박히는 남성 다큐멘터리 해설 톤 (InJoon)
  rate: "+6%"                        # 유튜브 다큐에 최적화된 빠르고 몰입감 넘치는 템포 (+6%)
  elevenlabs_voice_id: ""
  elevenlabs_model: "eleven_multilingual_v2"

video_gen:                           # 핵심 장면 AI 동영상 (Google Veo 3.1)
  enabled: true
  model: "veo-3.1-generate-preview"
  max_scenes: 4                      # 핵심 4대 승부처(도입 파도, 난관 충격, 공학 메커니즘, 클라이맥스)에 Veo 3.1 집중 투입 (비용 1/4 절감)
  seconds: 8
  resolution: "1080p"
  slow_factor: 0.8                   # 클립 재생 속도(0.8 = 20% 느리게 → 10초)
  style_suffix: >
    smooth cinematic orbital camera pan around photorealistic 3D maritime engineering structure,
    integrated natural shoreline landscape, realistic fluid dynamic ocean water simulation, slow-motion wave action,
    hyper-detailed 4k civil engineering visualization, raytraced water reflections, high-end technical animation, no cartoon, no watermark, no text

video:
  fps: 24
  parallax_strength: 0.08            # 2.5D 패럴랙스 세기 (0.03 은은함 ~ 0.08 역동적 카메라 무빙)
  dust_opacity: 0.55                 # 부유물 파티클 밝기 0~1 (0이면 끔)
  subtitle_font: "assets/fonts/NotoSansCJK-Bold.ttc"
  subtitle_size: 64
  bgm_volume: 0.08                   # 0~1
  bgm_dir: "assets/bgm"

thumbnail:
  font: "assets/fonts/NotoSansCJK-Black.ttc"
  font_size: 170

youtube:
  privacy: "public"                  # public | unlisted | private
  category_id: "27"                  # 27 = Education
  default_tags: ["항만", "해안", "토목", "방파제", "해안침식", "바다"]
  client_secret: "client_secret.json"
  token_file: "token.json"
