name: daily-video

on:
  schedule:
    - cron: "0 18 * * *"        # 매일 새벽 03:00 KST (UTC 18:00)
  workflow_dispatch:            # Actions 탭에서 수동 실행 버튼
    inputs:
      topic:
        description: "주제 (비우면 topics.txt 첫 줄 사용)"
        required: false
      no_upload:
        description: "업로드 생략 (검토용)"
        type: boolean
        default: false

permissions:
  contents: write               # topics.txt 소비 내역을 다시 커밋하기 위해

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg + 한글 폰트
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Python 패키지
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements.txt

      - name: 깊이 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: depth-anything-v2-small

      - name: 인증 파일 복원
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          echo "$CLIENT_SECRET_JSON" > client_secret.json
          echo "$TOKEN_JSON" > token.json

      - name: 영상 제작 + 업로드
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then ARGS="$ARGS --topic \"${{ github.event.inputs.topic }}\""; fi
          if [ "${{ github.event.inputs.no_upload }}" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          eval python run.py $ARGS

      - name: 결과물 보관 (30일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            output/**/final.mp4
            output/**/thumbnail.jpg
            output/**/script.json
            output/**/subtitles.srt
          retention-days: 30
          if-no-files-found: ignore

      - name: 주제 소비 내역 커밋
        if: success()
        run: |
          git config user.name "video-bot"
          git config user.email "bot@users.noreply.github.com"
          git add topics.txt topics_done.txt uploaded.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "video: $(date +%F) 제작 완료"
          git push
